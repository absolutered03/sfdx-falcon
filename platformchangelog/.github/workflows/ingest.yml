# Scheduled ingestion. Lives here so the job, its logs and its secrets are all in the repo
# you already watch; no queue, worker or extra service in v1.
# Note: GitHub only runs workflows from the repository root's .github/ directory.
name: ingest
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the top of the hour
  workflow_dispatch: {}
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # release notes via the GitHub API; built in, no secret to add
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-opus-5-5' }}
          MAX_LLM_CALLS_PER_RUN: ${{ vars.MAX_LLM_CALLS_PER_RUN || '40' }}
